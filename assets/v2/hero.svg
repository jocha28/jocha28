<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300" role="img" aria-label="JOCHA : backend, Odoo, IA, Cotonou">
  <style>
    .f { font-family: 'Space Grotesk','Inter','Segoe UI','Helvetica Neue',Arial,sans-serif; }
    .m { font-family: 'JetBrains Mono','Fira Code',Consolas,'Liberation Mono',monospace; }
    .name { font-size: 104px; font-weight: 900; letter-spacing: 18px; }
    .g1 { fill: #00e5ff; mix-blend-mode: screen; animation: g1 4s steps(1) infinite; }
    .g2 { fill: #ff2e63; mix-blend-mode: screen; animation: g2 4s steps(1) infinite; }
    .main { fill: #f5f7fb; }
    .role { font-size: 18px; fill: #fcd116; letter-spacing: 4px; opacity: 0; animation: role 12s infinite; }
    .r2 { animation-delay: 3s; } .r3 { animation-delay: 6s; } .r4 { animation-delay: 9s; }
    .tag { font-size: 12px; fill: #8b97a8; letter-spacing: 5px; }
    .sweep { animation: sweep 6s ease-in-out infinite; }
    .scan { animation: scan 8s linear infinite; }
    .pulse { animation: pulse 2s ease-in-out infinite; }
    @keyframes g1 { 0%,86%,100% { transform: translate(0,0); } 88% { transform: translate(-6px,2px); } 90% { transform: translate(5px,-3px); } 92% { transform: translate(-3px,0); } }
    @keyframes g2 { 0%,86%,100% { transform: translate(0,0); } 88% { transform: translate(6px,-2px); } 90% { transform: translate(-5px,3px); } 92% { transform: translate(3px,1px); } }
    @keyframes role { 0% { opacity: 0; transform: translateY(8px); } 4%,21% { opacity: 1; transform: translateY(0); } 25%,100% { opacity: 0; transform: translateY(-8px); } }
    @keyframes sweep { 0% { transform: translateX(-400px); } 60%,100% { transform: translateX(1100px); } }
    @keyframes scan { from { transform: translateY(-40px); } to { transform: translateY(320px); } }
    @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
  </style>
  <defs>
    <pattern id="kente" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M24 2 L46 24 L24 46 L2 24 Z" fill="none" stroke="#fcd116" stroke-opacity=".10" stroke-width="1.5"/>
      <path d="M24 12 L36 24 L24 36 L12 24 Z" fill="#008751" fill-opacity=".10"/>
      <path d="M0 0 L8 0 L0 8 Z M48 0 L40 0 L48 8 Z M0 48 L8 48 L0 40 Z M48 48 L40 48 L48 40 Z" fill="#e8112d" fill-opacity=".16"/>
    </pattern>
    <radialGradient id="glow" cx=".5" cy=".55" r=".6">
      <stop offset="0" stop-color="#1a2440" stop-opacity="1"/>
      <stop offset="1" stop-color="#07090f" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07090f" stop-opacity="0"/>
      <stop offset=".55" stop-color="#07090f" stop-opacity=".2"/>
      <stop offset="1" stop-color="#07090f" stop-opacity=".95"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#008751"/>
      <stop offset=".5" stop-color="#fcd116"/>
      <stop offset="1" stop-color="#e8112d"/>
    </linearGradient>
    <clipPath id="c"><rect width="860" height="300" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#c)">
    <rect width="860" height="300" fill="url(#glow)"/>
    <rect width="860" height="300" fill="url(#kente)"/>
    <rect width="860" height="300" fill="url(#fade)"/>
    <rect class="sweep" x="0" y="-50" width="220" height="400" fill="url(#beam)" transform="skewX(-20)"/>
    <rect class="scan" x="0" y="0" width="860" height="2" fill="#00e5ff" opacity=".12"/>

    <!-- coins HUD -->
    <path d="M24 46 V24 H46 M814 24 H836 V46 M836 254 V276 H814 M46 276 H24 V254" stroke="#fcd116" stroke-width="2" fill="none" stroke-opacity=".7"/>
    <g class="m tag">
      <text x="56" y="44">SYS://JOCHA28</text>
      <text x="804" y="44" text-anchor="end">06°22'N · 02°25'E</text>
      <text x="56" y="266">COTONOU · BÉNIN</text>
      <text x="804" y="266" text-anchor="end"><tspan class="pulse" fill="#3ddc84">●</tspan> EN LIGNE</text>
    </g>

    <!-- nom glitch -->
    <g class="f name" text-anchor="middle">
      <text x="439" y="160" class="g1">JOCHA</text>
      <text x="439" y="160" class="g2">JOCHA</text>
      <text x="439" y="160" class="main">JOCHA</text>
    </g>
    <rect x="250" y="182" width="378" height="3" rx="1.5" fill="url(#line)"/>

    <!-- roles qui defilent -->
    <g class="m" text-anchor="middle">
      <text x="430" y="220" class="role">BACKEND DEVELOPER</text>
      <text x="430" y="220" class="role r2">ODOO 17 · 18 · 19</text>
      <text x="430" y="220" class="role r3">MACHINE LEARNING · VISION</text>
      <text x="430" y="220" class="role r4">RAP / TRAP TECH</text>
    </g>
  </g>
</svg>
