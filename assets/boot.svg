<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" role="img" aria-label="JOCHA OS : sequence de demarrage">
  <style>
    .mono { font-family: 'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace; font-size: 14px; }
    .dim { fill: #6b7a90; }
    .txt { fill: #d7e0ee; }
    .ok { fill: #3ddc84; font-weight: 700; }
    .note { fill: #ffd447; font-weight: 700; }
    .val { fill: #7cc4ff; }
    .prompt { fill: #3ddc84; font-weight: 700; }
    .path { fill: #7cc4ff; font-weight: 700; }
    .title { font-family: 'JetBrains Mono',Consolas,monospace; font-size: 12px; fill: #8b97a8; }
    .logo { font-family: 'JetBrains Mono',Consolas,monospace; font-size: 30px; font-weight: 800; letter-spacing: 10px; fill: #f2f5fa; }
    .sub { font-family: 'JetBrains Mono',Consolas,monospace; font-size: 12px; fill: #8b97a8; letter-spacing: 3px; }

    .type { clip-path: inset(0 100% 0 0); animation: type 1.1s steps(22) .3s forwards; }
    .line { opacity: 0; animation: show .01s forwards; }
    .l1 { animation-delay: 1.6s; } .l2 { animation-delay: 2.0s; } .l3 { animation-delay: 2.4s; }
    .l4 { animation-delay: 2.8s; } .l5 { animation-delay: 3.2s; } .l6 { animation-delay: 3.6s; }
    .l7 { animation-delay: 4.2s; }
    .cursor { animation: blink 1s steps(1) 4.2s infinite; opacity: 0; }
    .bar { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation: grow 2.8s ease-out 1.5s forwards; }

    .owl { opacity: 0; animation: show .6s ease-out 4.6s forwards; }
    .lid { transform-box: fill-box; transform-origin: center top; transform: scaleY(0); animation: wink 5s ease-in-out 6s infinite; }
    .star { animation: twinkle 3s ease-in-out infinite; }
    .s2 { animation-delay: 1s; } .s3 { animation-delay: 2s; }

    @keyframes type { to { clip-path: inset(0 0 0 0); } }
    @keyframes show { to { opacity: 1; } }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes grow { to { transform: scaleX(1); } }
    @keyframes wink { 0%, 92%, 100% { transform: scaleY(0); } 95% { transform: scaleY(1); } }
    @keyframes twinkle { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
  </style>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1320"/>
      <stop offset="1" stop-color="#111a2b"/>
    </linearGradient>
    <clipPath id="win"><rect x="0" y="0" width="860" height="360" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#win)">
    <rect width="860" height="360" fill="url(#bg)"/>

    <!-- barre de titre -->
    <rect width="860" height="34" fill="#0a0f19"/>
    <circle cx="20" cy="17" r="6" fill="#ff5f57"/>
    <circle cx="40" cy="17" r="6" fill="#febc2e"/>
    <circle cx="60" cy="17" r="6" fill="#28c840"/>
    <text x="430" y="21" text-anchor="middle" class="title">jocha@cotonou : ~/profil</text>

    <!-- etoiles -->
    <circle class="star" cx="640" cy="70" r="1.6" fill="#ffd447"/>
    <circle class="star s2" cx="790" cy="60" r="1.3" fill="#ffffff"/>
    <circle class="star s3" cx="710" cy="110" r="1.2" fill="#ffffff"/>
    <circle class="star s2" cx="820" cy="150" r="1.5" fill="#ffd447"/>
    <circle class="star" cx="600" cy="140" r="1.1" fill="#ffffff"/>

    <!-- terminal -->
    <g class="mono">
      <text x="26" y="66"><tspan class="prompt">jocha@cotonou</tspan><tspan class="txt">:</tspan><tspan class="path">~</tspan><tspan class="txt">$ </tspan></text>
      <text x="168" y="66" class="txt type">./boot --profil jocha28</text>

      <text x="26" y="100" class="line l1"><tspan class="ok">[ OK ]</tspan><tspan class="txt"> Odoo ERP ............. </tspan><tspan class="val">v17 · v18 · v19</tspan></text>
      <text x="26" y="124" class="line l2"><tspan class="ok">[ OK ]</tspan><tspan class="txt"> Mobile Money ......... </tspan><tspan class="val">FedaPay · KkiaPay · MoMo</tspan></text>
      <text x="26" y="148" class="line l3"><tspan class="ok">[ OK ]</tspan><tspan class="txt"> Facture normalisée ... </tspan><tspan class="val">DGI · MECEF · CC300</tspan></text>
      <text x="26" y="172" class="line l4"><tspan class="ok">[ OK ]</tspan><tspan class="txt"> Biométrie faciale .... </tspan><tspan class="val">FaceNet · FastAPI</tspan></text>
      <text x="26" y="196" class="line l5"><tspan class="ok">[ OK ]</tspan><tspan class="txt"> Langues .............. </tspan><tspan class="val">français ⇄ fongbè</tspan></text>
      <text x="26" y="220" class="line l6"><tspan class="note">[ ♪♪ ]</tspan><tspan class="txt"> Face B ............... </tspan><tspan class="val">rap / trap tech</tspan></text>

      <rect x="26" y="236" width="440" height="4" rx="2" fill="#1e2a3d"/>
      <rect class="bar" x="26" y="236" width="440" height="4" rx="2" fill="#3ddc84"/>

      <text x="26" y="270" class="line l7"><tspan class="prompt">jocha@cotonou</tspan><tspan class="txt">:</tspan><tspan class="path">~</tspan><tspan class="txt">$ </tspan><tspan class="dim"># prêt. on construit quoi aujourd'hui ?</tspan></text>
      <rect class="cursor" x="26" y="282" width="9" height="16" fill="#3ddc84"/>
    </g>

    <!-- hibou -->
    <g class="owl" transform="translate(655 168)">
      <path d="M-58 -50 L-40 -88 L-22 -58 Z" fill="#2b3a55"/>
      <path d="M58 -50 L40 -88 L22 -58 Z" fill="#2b3a55"/>
      <ellipse cx="0" cy="0" rx="66" ry="74" fill="#2b3a55"/>
      <ellipse cx="0" cy="22" rx="42" ry="46" fill="#3a4c6e"/>
      <path d="M-26 20 q6 6 12 0 M-6 34 q6 6 12 0 M14 20 q6 6 12 0 M-16 50 q6 6 12 0 M4 50 q6 6 12 0" stroke="#55698f" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <circle cx="-26" cy="-26" r="24" fill="#f2f5fa"/>
      <circle cx="26" cy="-26" r="24" fill="#f2f5fa"/>
      <circle cx="-24" cy="-24" r="11" fill="#0d1320"/>
      <circle cx="28" cy="-24" r="11" fill="#0d1320"/>
      <circle cx="-20" cy="-29" r="3.5" fill="#ffffff"/>
      <circle cx="32" cy="-29" r="3.5" fill="#ffffff"/>
      <rect class="lid" x="-50" y="-50" width="48" height="48" rx="24" fill="#2b3a55"/>
      <rect class="lid" x="2" y="-50" width="48" height="48" rx="24" fill="#2b3a55"/>
      <path d="M-8 -8 L0 8 L8 -8 Z" fill="#ffd447"/>
      <path d="M-26 72 l-6 10 M-20 72 l0 11 M-14 72 l6 10 M14 72 l-6 10 M20 72 l0 11 M26 72 l6 10" stroke="#ffd447" stroke-width="3" stroke-linecap="round"/>
      <rect x="-110" y="84" width="220" height="7" rx="3.5" fill="#5a3e2b"/>
    </g>
    <text x="655" y="300" text-anchor="middle" class="logo line l7">JOCHA</text>
    <text x="655" y="322" text-anchor="middle" class="sub line l7">🦉 ✕ 🐾 · COTONOU</text>

    <!-- drapeau du Benin -->
    <rect x="0" y="352" width="344" height="8" fill="#008751"/>
    <rect x="344" y="352" width="516" height="4" fill="#fcd116"/>
    <rect x="344" y="356" width="516" height="4" fill="#e8112d"/>
  </g>
</svg>
