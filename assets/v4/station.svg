<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300" role="img" aria-label="Station JOCHA, Cotonou-Centre">
  <style>
    .train { animation: pass 9s cubic-bezier(.55,0,.45,1) infinite; }
    .sec { transform-origin: 0 0; animation: spin 60s linear infinite; }
    .min { transform-origin: 0 0; animation: spin 3600s linear infinite; }
    .lamp { animation: lamp 1.6s ease-in-out infinite; }
    @keyframes pass { 0% { transform: translateX(-460px); } 55%, 100% { transform: translateX(900px); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes lamp { 50% { opacity: .25; } }
  </style>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#0d1b2e"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#173a6b"/><stop offset="1" stop-color="#0f2a52"/>
    </linearGradient>
    <clipPath id="c"><rect width="860" height="300" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="860" height="300" fill="url(#sky)"/>
    <!-- tunnel -->
    <rect x="0" y="20" width="860" height="76" fill="#0a1626"/>
    <rect x="20" y="20" width="3" height="76" fill="#13243b"/><rect x="90" y="20" width="3" height="76" fill="#13243b"/><rect x="160" y="20" width="3" height="76" fill="#13243b"/><rect x="230" y="20" width="3" height="76" fill="#13243b"/><rect x="300" y="20" width="3" height="76" fill="#13243b"/><rect x="370" y="20" width="3" height="76" fill="#13243b"/><rect x="440" y="20" width="3" height="76" fill="#13243b"/><rect x="510" y="20" width="3" height="76" fill="#13243b"/><rect x="580" y="20" width="3" height="76" fill="#13243b"/><rect x="650" y="20" width="3" height="76" fill="#13243b"/><rect x="720" y="20" width="3" height="76" fill="#13243b"/><rect x="790" y="20" width="3" height="76" fill="#13243b"/>
    <rect x="0" y="84" width="860" height="3" fill="#3a4a60"/>
    <rect x="0" y="92" width="860" height="3" fill="#3a4a60"/>
    <g class="train">
      <rect x="0" y="36" width="420" height="44" rx="18" fill="#e9eef5"/>
      <rect x="0" y="66" width="420" height="5" fill="#008751"/>
      <rect x="0" y="71" width="420" height="3" fill="#fcd116"/>
      <rect x="0" y="74" width="420" height="3" fill="#e8112d"/>
      <rect x="28" y="46" width="34" height="16" rx="4" fill="#cfe8ff" fill-opacity=".85"/><rect x="74" y="46" width="34" height="16" rx="4" fill="#cfe8ff" fill-opacity=".85"/><rect x="120" y="46" width="34" height="16" rx="4" fill="#cfe8ff" fill-opacity=".85"/><rect x="166" y="46" width="34" height="16" rx="4" fill="#cfe8ff" fill-opacity=".85"/><rect x="212" y="46" width="34" height="16" rx="4" fill="#cfe8ff" fill-opacity=".85"/><rect x="258" y="46" width="34" height="16" rx="4" fill="#cfe8ff" fill-opacity=".85"/><rect x="304" y="46" width="34" height="16" rx="4" fill="#cfe8ff" fill-opacity=".85"/><rect x="350" y="46" width="34" height="16" rx="4" fill="#cfe8ff" fill-opacity=".85"/><rect x="396" y="46" width="34" height="16" rx="4" fill="#cfe8ff" fill-opacity=".85"/>
      <path d="M402 36 h0 a18 18 0 0 1 18 18 v8 h-30 z" fill="#0b1f3a" fill-opacity=".85"/>
      <circle cx="410" cy="72" r="3" fill="#fff3b0"/>
      <text x="200" y="31" text-anchor="middle" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="700" fill="#7f93b3" letter-spacing="3">DIRECTION · LE FUTUR</text>
    </g>
    <rect x="0" y="96" width="860" height="8" fill="#05090f"/>

    <!-- plaque -->
    <rect x="34" y="122" width="792" height="150" rx="18" fill="url(#plate)" stroke="#f2f5fa" stroke-width="4"/>
    <rect x="44" y="132" width="772" height="130" rx="12" fill="none" stroke="#f2f5fa" stroke-opacity=".25" stroke-width="1.5"/>
    <circle cx="96" cy="186" r="17" fill="#9b5de5"/><text x="96" y="192.4" text-anchor="middle" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17.9" font-weight="800" fill="#ffffff">O</text><circle cx="140" cy="186" r="17" fill="#2ec27e"/><text x="140" y="192.4" text-anchor="middle" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17.9" font-weight="800" fill="#ffffff">M</text><circle cx="184" cy="186" r="17" fill="#22b8f0"/><text x="184" y="191.2" text-anchor="middle" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14.4" font-weight="800" fill="#ffffff">IA</text><circle cx="228" cy="186" r="17" fill="#f5b700"/><text x="228" y="192.4" text-anchor="middle" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17.9" font-weight="800" fill="#1a1300">F</text>
    <text x="96" y="236" font-family="'JetBrains Mono','Fira Code',Consolas,'Liberation Mono',monospace" font-size="11" fill="#9db4d6" letter-spacing="2">4 LIGNES · 1 HUB</text>
    <text x="294" y="204" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="70" font-weight="900" fill="#f8fafc" letter-spacing="6">JOCHA</text>
    <text x="298" y="238" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="600" fill="#c9d7ee" letter-spacing="1">Cotonou · Centre  ·  Backend · Odoo · IA</text>
    <circle class="lamp" cx="602" cy="160" r="5" fill="#3ddc84"/>
    <text x="614" y="165" font-family="'JetBrains Mono','Fira Code',Consolas,'Liberation Mono',monospace" font-size="11" fill="#3ddc84" letter-spacing="2">EN SERVICE</text>

    <!-- horloge -->
    <g transform="translate(748 197)">
      <circle r="50" fill="#0b1f3a"/>
      <circle r="44" fill="#f8fafc"/>
      <line x1="0" y1="-38" x2="0" y2="-28" stroke="#0b1f3a" stroke-width="3.5" transform="rotate(0)"/><line x1="0" y1="-38" x2="0" y2="-32" stroke="#0b1f3a" stroke-width="2" transform="rotate(30)"/><line x1="0" y1="-38" x2="0" y2="-32" stroke="#0b1f3a" stroke-width="2" transform="rotate(60)"/><line x1="0" y1="-38" x2="0" y2="-28" stroke="#0b1f3a" stroke-width="3.5" transform="rotate(90)"/><line x1="0" y1="-38" x2="0" y2="-32" stroke="#0b1f3a" stroke-width="2" transform="rotate(120)"/><line x1="0" y1="-38" x2="0" y2="-32" stroke="#0b1f3a" stroke-width="2" transform="rotate(150)"/><line x1="0" y1="-38" x2="0" y2="-28" stroke="#0b1f3a" stroke-width="3.5" transform="rotate(180)"/><line x1="0" y1="-38" x2="0" y2="-32" stroke="#0b1f3a" stroke-width="2" transform="rotate(210)"/><line x1="0" y1="-38" x2="0" y2="-32" stroke="#0b1f3a" stroke-width="2" transform="rotate(240)"/><line x1="0" y1="-38" x2="0" y2="-28" stroke="#0b1f3a" stroke-width="3.5" transform="rotate(270)"/><line x1="0" y1="-38" x2="0" y2="-32" stroke="#0b1f3a" stroke-width="2" transform="rotate(300)"/><line x1="0" y1="-38" x2="0" y2="-32" stroke="#0b1f3a" stroke-width="2" transform="rotate(330)"/>
      <g transform="rotate(84)"><rect x="-2.5" y="-24" width="5" height="26" rx="2.5" fill="#0b1f3a"/></g>
      <g class="min"><rect x="-2" y="-34" width="4" height="36" rx="2" fill="#0b1f3a"/></g>
      <g class="sec"><rect x="-.8" y="-38" width="1.6" height="46" fill="#e8112d"/><circle cy="-30" r="3.5" fill="#e8112d"/></g>
      <circle r="3.5" fill="#0b1f3a"/>
    </g>
  </g>
</svg>
